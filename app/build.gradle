plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace = 'com.jarvisai'
    compileSdk = 36

    defaultConfig {
        applicationId = 'com.jarvisai'
        minSdk = 24
        targetSdk = 36
        versionCode = 5
        versionName = '1.4'
        testInstrumentationRunner = 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
    }
}

def jarvisLogoSource = file("$projectDir/src/main/jarvis_logo.webp.b64")
def jarvisLogoOutput = file("$projectDir/src/main/res/drawable/jarvis_logo.webp")

tasks.register('prepareJarvisLogo') {
    inputs.file jarvisLogoSource
    outputs.file jarvisLogoOutput
    doLast {
        if (!jarvisLogoSource.exists()) throw new GradleException('JARVIS logo source is missing.')
        jarvisLogoOutput.parentFile.mkdirs()
        def encoded = jarvisLogoSource.getText('UTF-8').replaceAll(/\s+/, '')
        jarvisLogoOutput.bytes = java.util.Base64.decoder.decode(encoded)
    }
}

tasks.named('preBuild').configure { dependsOn tasks.named('prepareJarvisLogo') }

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
